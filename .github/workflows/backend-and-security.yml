name: ReachHub Backend & Security Checks

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-test-and-build:
    name: Typecheck, Test & Audit Cloud Run Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 22 with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies reproducibly
        run: npm ci --no-audit --no-fund

      - name: Compile TypeScript
        run: npm run build

      - name: Run Cloud Run backend security & webhook tests
        run: npm test

      - name: Run npm production dependency vulnerability audit
        run: npm audit --omit=dev --audit-level=high

  secret-hygiene-and-manifest-check:
    name: Secret Hygiene & Android Security Manifest Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan Android, backend, and workflow files for embedded credentials
        run: |
          if grep -rnE "EAAG[A-Za-z0-9]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|AIza[0-9A-Za-z_-]{35}" app/ backend/src/ .github/; then
            echo "ERROR: Detected potential hardcoded credential or private key!" >&2
            exit 1
          fi
          echo "Secret hygiene check passed."

      - name: Verify Android manifest transport and backup hardening
        run: |
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="false"' app/src/main/AndroidManifest.xml
          echo "Android manifest hardening check passed."
