name: ReachHub Android Debug CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-debug:
    name: Test & Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Configure Android SDK environment without passing concatenated package strings to setup-android.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Accept Android SDK licenses and install required SDK packages
        run: |
          printf 'y\n%.0s' {1..50} | sdkmanager --licenses
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

      - name: Verify installed Android SDK packages
        run: sdkmanager --list_installed

      - name: Set up Gradle 9.3.1 with caching
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug keystore for debugConfig signing
        run: |
          if [ ! -f debug.keystore ]; then
            if [ ! -f debug.keystore.base64 ]; then
              echo "ERROR: Missing debug.keystore.base64 required for app/build.gradle.kts debugConfig" >&2
              exit 1
            fi
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          gradle --version

      - name: Run unit and Robolectric tests
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew testDebugUnitTest --no-daemon --stacktrace
          else
            gradle testDebugUnitTest --no-daemon --stacktrace
          fi

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "ERROR: Expected APK app/build/outputs/apk/debug/app-debug.apk was not generated" >&2
            exit 1
          fi
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Clean up decoded debug keystore
        if: always()
        run: rm -f debug.keystore

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: reachhub-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
